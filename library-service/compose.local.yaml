name: library-service-local

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - target: 5432
        host_ip: 127.0.0.1
    volumes:
      - local-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  local-postgres-data:
